spring.application.name=SubscriptionManager

# --- CONEXIÓN A BASE DE DATOS LOCAL ---
# Asegúrate de que el puerto (5432) y el nombre de la DB coincidan
spring.datasource.url=jdbc:postgresql://localhost:5432/subscription_db

# Tu usuario (por defecto suele ser postgres)
spring.datasource.username=postgres

# ¡AQUÍ VA TU CONTRASEÑA! (La que te pide pgAdmin)
spring.datasource.password=123456

# --- CONFIGURACIÓN DE JPA (HIBERNATE) ---
# "update": Crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
# IMPORTANTE: Esto le permite a Hibernate crear/actualizar tablas
# Opcional: Para ver el SQL en la consola (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#security
spring.security.user.name=admin
spring.security.user.password=1234

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
# Genera esto online (HMAC-SHA256 Base64 encoded)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 86400000 milisegundos = 1 día
application.security.jwt.expiration=86400000

# --- CONFIGURACIÓN SMTP (Ejemplo con Gmail) ---


app.notifications.days-before=3
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_USUARIO_MAILTRAP
spring.mail.password=TU_PASSWORD_MAILTRAP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true