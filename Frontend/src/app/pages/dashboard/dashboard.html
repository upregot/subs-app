<div class="container mt-5 pb-5">

  <!-- CABECERA: Limpia y con tipografía grande -->
  <div class="d-flex justify-content-between align-items-end mb-5">
    <div>
      <h1 class="fw-bold m-0" style="letter-spacing: -1px;">Mis Suscripciones</h1>
      <p class="text-muted m-0" style="font-size: 1.1rem;">Gestiona tus gastos recurrentes</p>
    </div>
    
    <button class="btn btn-primary ios-btn shadow-sm" routerLink="/subscriptions/new">
      <i class="bi bi-plus-lg me-1"></i> Nueva
    </button>
  </div>

  <div class="row g-4"> <!-- g-4 para más espacio entre tarjetas -->

    <!-- ESTADO VACÍO -->
    <div class="col-12" *ngIf="subscriptions.length === 0">
      <div class="ios-card text-center p-5">
        <div class="mb-3 text-muted" style="font-size: 3rem;">📱</div>
        <h3 class="fw-bold">Sin suscripciones</h3>
        <p class="text-muted">Añade tu primer servicio para empezar.</p>
        <button class="btn btn-link text-decoration-none p-0" routerLink="/subscriptions/new">Crear ahora &rarr;</button>
      </div>
    </div>

    <!-- TARJETAS ESTILO APPLE -->
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let sub of subscriptions">
      <div class="ios-card h-100 d-flex flex-column justify-content-between">
        
        <!-- Parte Superior -->
        <div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-capitalize">{{ sub.name }}</h5>
            
            <!-- Badge estilo iOS (Pastilla suave) -->
            <span class="ios-badge"
                  [ngClass]="{
                    'badge-monthly': sub.frequency === 'MONTHLY',
                    'badge-yearly': sub.frequency === 'YEARLY',
                    'badge-weekly': sub.frequency === 'WEEKLY',
                    'badge-onetime': sub.frequency === 'ONE_TIME'
                  }">
              {{ sub.frequency }}
            </span>
          </div>

          <!-- Precio -->
          <div class="price-container">
            <span class="currency text-muted">{{ sub.currency }}</span>
            <span class="amount">{{ sub.price | number:'1.0-2' }}</span>
          </div>
        </div>

        <!-- Parte Inferior (Separador sutil) -->
        <div class="mt-4 pt-3 border-top border-light">
          <div class="d-flex justify-content-between align-items-center">
            
            <!-- Fecha -->
            <div *ngIf="sub.nextBillingDate">
              <span class="d-block text-muted caption">Próximo cobro</span>
              <span class="fw-semibold date-text">
                {{ sub.nextBillingDate | date:'d MMM y' }}
              </span>
            </div>
            <div *ngIf="!sub.nextBillingDate">
              <span class="text-muted caption">Pago único completado</span>
            </div>

            <!-- Botón Eliminar (Circular) -->
            <button class="btn-icon-delete" (click)="deleteSubscription(sub.id!)" title="Eliminar">
              <i class="bi bi-trash3-fill"></i>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
