<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="images/logo.svg" width="60" class="mb-3">
      <h2 class="fw-bold">Inicia sesión</h2>
      <p class="text-muted">Gestiona tus suscripciones con facilidad.</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <input type="text" class="form-control" [(ngModel)]="loginData.username" name="username" placeholder="Usuario" required>
      </div>
      <div class="mb-4">
        <input type="password" class="form-control" [(ngModel)]="loginData.password" name="password" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Continuar</button>
      <div class="text-center">
        <a routerLink="/register" class="auth-link">¿No tienes cuenta? Crea una</a>
      </div>
    </form>
  </div>
</div>
