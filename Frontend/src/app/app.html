<!-- Navbar estilo Apple (Glassmorphism) -->
<header class="apple-navbar">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center h-100">
      
      <!-- Logo y Nombre -->
      <a class="nav-brand d-flex align-items-center gap-2" routerLink="/dashboard">
        <!-- Ajusta el width si tu logo es muy grande -->
        <img src="images/logo.svg" alt="Logo" width="32" height="32">
        <span class="brand-text">Subscription Manager</span>
      </a>

      <!-- Botón Salir -->
      <button *ngIf="authService.isLoggedIn()" 
              (click)="logout()" 
              class="logout-btn">
        <span>Salir</span>
        <i class="bi bi-box-arrow-right"></i>
      </button>

    </div>
  </div>
</header>

<!-- Contenido Principal -->
<main>
  <router-outlet></router-outlet>
</main>
